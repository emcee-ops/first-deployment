<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="opening.css">
    <title>Dashboard</title>
</head>
<body>

<div class="container">
    <div class="text">
        <div class="logo">
        <img src="HSU.png" class="HSU">
        <img src="UAH.png" class="UAH">
    </div>
        <div class="name">
        <strong id="umak">UMak</strong>
        <strong id="anonhub"> AnonHub</strong>
        </div>
        <h1 class="quote">“Anonymous Website Exclusively for HSU Students”</h3>
    
    <form action="index.html" method="post">
        <input class ="button" type="submit" value="Click here to start your browsing journey" >
    </form>
</div>

    <div class="theme-toggle">
        <button id="dark-mode-toggle" class="toggle-icon">⏾</button>
    </div>
</div>
    
    <script>
        const toggleButton = document.getElementById('dark-mode-toggle');
    
        // Dark Mode Theme
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            toggleButton.textContent = '⏾'; 
        }
    
        toggleButton.addEventListener('click', () => {
            const isDarkMode = document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            toggleButton.textContent = isDarkMode ? '☀︎' : '⏾';
        });
    </script>

</body>
</html>
